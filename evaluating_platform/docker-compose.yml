services:
  postgres:
    image: postgres:16-alpine
    container_name: ep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qianxinshujuku@2026
      POSTGRES_DB: evaluating_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ep_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ep_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: ep_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/evaluating-platform &&
      mc anonymous set download local/evaluating-platform/reports
      "
    restart: "no"

  maclaw-runtime:
    image: "${MACLAW_RUNTIME_IMAGE:-maclaw-runtime:latest}"
    container_name: ep_maclaw_runtime
    restart: unless-stopped
    # Docker daemon DNS (223.5.5.5/114.114.114.114) is unreachable from this
    # network; use the site resolver so tenant LLM hosts resolve.
    dns:
      - 10.95.38.38
    environment:
      MACLAW_DATA_ROOT: /data/maclaw
      MACLAW_HTTP_ADDR: 0.0.0.0:18080
      MACLAW_ALLOW_INSECURE_HTTP: "true"
      MACLAW_ADMIN_SECRET: "${MACLAW_ADMIN_SECRET:-ep-local-maclaw-admin-secret-change-me}"
      MACLAW_TOKEN_SECRET: "${MACLAW_TOKEN_SECRET:-ep-local-maclaw-token-secret-change-me-32chars}"
      MACLAW_CREDENTIAL_PEPPER: "${MACLAW_CREDENTIAL_PEPPER:-ep-local-maclaw-pepper}"
      MACLAW_SECURITY_POLICY_MODE: "${MACLAW_SECURITY_POLICY_MODE:-developer}"
      MACLAW_HTTP_WRITE_TIMEOUT_SECONDS: "${MACLAW_HTTP_WRITE_TIMEOUT_SECONDS:-600}"
      MACLAW_REMOTE_MCP_TOOL_TIMEOUT_SECONDS: "${MACLAW_REMOTE_MCP_TOOL_TIMEOUT_SECONDS:-650}"
      MACLAW_REDTEAM_SKILL_BATCH_SIZE: "${MACLAW_REDTEAM_SKILL_BATCH_SIZE:-}"
      MACLAW_REDTEAM_SKILL_BATCH_CONCURRENCY: "${MACLAW_REDTEAM_SKILL_BATCH_CONCURRENCY:-}"
    expose:
      - "18080"
    volumes:
      - maclaw_data:/data/maclaw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  hubcenter:
    image: "${MACLAW_HUBCENTER_IMAGE:-maclaw-hubcenter:latest}"
    container_name: ep_hubcenter
    restart: unless-stopped
    command: ["--config", "/app/configs/maclaw-hubcenter.yaml"]
    ports:
      - "9388:9388"
    volumes:
      - hubcenter_data:/data/hubcenter
      - ./configs/maclaw-hubcenter.yaml:/app/configs/maclaw-hubcenter.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9388/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ep_backend
    restart: unless-stopped
    # Same unreachable daemon DNS as maclaw-runtime: the BFF calls the judge
    # model (api.xiaomimimo.com) and LLM_BASE_URL (api.deepseek.com) directly.
    dns:
      - 10.95.38.38
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      maclaw-runtime:
        condition: service_healthy
      hubcenter:
        condition: service_healthy
      promptfoo-engine:
        condition: service_healthy
    environment:
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-dev}"
      CRYPTO_MASTER_KEY: "${CRYPTO_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      GIN_MODE: debug
      DATABASE_DSN: "host=postgres user=postgres password=Qianxinshujuku@2026 dbname=evaluating_platform port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
      STORAGE_ENDPOINT: "minio:9000"
      MACLAW_BASE_URL: "${MACLAW_BASE_URL:-http://maclaw-runtime:18080}"
      MACLAW_RUNTIME_KIND: "${MACLAW_RUNTIME_KIND:-maclawsrv}"
      MACLAW_RUNTIME_MODE: "${MACLAW_RUNTIME_MODE:-compose}"
      MACLAW_CAPABILITY_PROFILE: "${MACLAW_CAPABILITY_PROFILE:-shadow}"
      MACLAW_TIMEOUT_SECONDS: "${MACLAW_TIMEOUT_SECONDS:-360}"
      MACLAW_ADMIN_SECRET: "${MACLAW_ADMIN_SECRET:-ep-local-maclaw-admin-secret-change-me}"
      MACLAW_PROVISIONING_ENABLED: "true"
      MACLAW_REDTEAM_MCP_ENDPOINT: "${MACLAW_REDTEAM_MCP_ENDPOINT:-http://backend:8080/api/v1/internal/maclaw/redteam-mcp}"
      MACLAW_REDTEAM_MCP_SECRET: "${MACLAW_REDTEAM_MCP_SECRET:-ep-local-redteam-mcp-secret-change-me}"
      MACLAW_REDTEAM_TARGET_CONCURRENCY: "${MACLAW_REDTEAM_TARGET_CONCURRENCY:-5}"
      MACLAW_REDTEAM_TARGET_MAX_TOKENS: "${MACLAW_REDTEAM_TARGET_MAX_TOKENS:-512}"
      MACLAW_REDTEAM_JUDGE_MAX_TOKENS: "${MACLAW_REDTEAM_JUDGE_MAX_TOKENS:-1024}"
      # promptfoo-engine (Phase 0): BFF-side engine access. Empty base URL
      # disables all engine endpoints (fail-closed).
      PROMPTFOO_ENGINE_BASE_URL: "${PROMPTFOO_ENGINE_BASE_URL:-http://promptfoo-engine:8090}"
      PROMPTFOO_ENGINE_BEARER_TOKEN: "${PROMPTFOO_ENGINE_BEARER_TOKEN:-change-me-promptfoo-engine-bearer-secret}"
      PROMPTFOO_ENGINE_TIMEOUT_SECONDS: "${PROMPTFOO_ENGINE_TIMEOUT_SECONDS:-15}"
    ports:
      - "8088:8080"
    volumes:
      - ./configs:/app/configs:ro
      - ./migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: evaluating_platform-frontend:latest
    container_name: ep_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

  promptfoo-engine:
    build:
      context: ./promptfoo_engine
      dockerfile: Dockerfile
    image: evaluating_platform-promptfoo-engine:latest
    container_name: ep_promptfoo_engine
    restart: unless-stopped
    environment:
      # fail-closed security switches (also asserted at boot by the engine)
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "1"
      PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION: "1"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_SHARE: "1"
      PROMPTFOO_ENGINE_BEARER_TOKEN: "${PROMPTFOO_ENGINE_BEARER_TOKEN:-change-me-promptfoo-engine-bearer-secret}"
      PROMPTFOO_ENGINE_PORT: "8090"
      PROMPTFOO_ENGINE_DATA_ROOT: /data/runs
      PROMPTFOO_ENGINE_WORKERS: "${PROMPTFOO_ENGINE_WORKERS:-2}"
      PROMPTFOO_ENGINE_MAX_QUEUE: "${PROMPTFOO_ENGINE_MAX_QUEUE:-100}"
    # Internal only: no host port mapping. The BFF reaches the engine over
    # the compose network at http://promptfoo-engine:8090.
    expose:
      - "8090"
    volumes:
      - promptfoo_engine_data:/data/runs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  maclaw_data:
  hubcenter_data:
  promptfoo_engine_data:

networks:
  default:
    name: ep_network