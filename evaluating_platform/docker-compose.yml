services:
  postgres:
    image: postgres:16-alpine
    container_name: ep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qianxinshujuku@2026
      POSTGRES_DB: evaluating_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ep_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ep_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: ep_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/evaluating-platform &&
      mc anonymous set download local/evaluating-platform/reports
      "
    restart: "no"

  maclaw-runtime:
    image: "${MACLAW_RUNTIME_IMAGE:-maclaw-runtime:latest}"
    container_name: ep_maclaw_runtime
    restart: unless-stopped
    # Docker daemon DNS (223.5.5.5/114.114.114.114) is unreachable from this
    # network; use the site resolver so tenant LLM hosts resolve.
    dns:
      - 10.95.38.38
    environment:
      MACLAW_DATA_ROOT: /data/maclaw
      MACLAW_HTTP_ADDR: 0.0.0.0:18080
      MACLAW_ALLOW_INSECURE_HTTP: "true"
      MACLAW_ADMIN_SECRET: "${MACLAW_ADMIN_SECRET:-ep-local-maclaw-admin-secret-change-me}"
      MACLAW_TOKEN_SECRET: "${MACLAW_TOKEN_SECRET:-ep-local-maclaw-token-secret-change-me-32chars}"
      MACLAW_CREDENTIAL_PEPPER: "${MACLAW_CREDENTIAL_PEPPER:-ep-local-maclaw-pepper}"
      MACLAW_SECURITY_POLICY_MODE: "${MACLAW_SECURITY_POLICY_MODE:-developer}"
      MACLAW_HTTP_WRITE_TIMEOUT_SECONDS: "${MACLAW_HTTP_WRITE_TIMEOUT_SECONDS:-600}"
      MACLAW_REMOTE_MCP_TOOL_TIMEOUT_SECONDS: "${MACLAW_REMOTE_MCP_TOOL_TIMEOUT_SECONDS:-650}"
      MACLAW_REDTEAM_SKILL_BATCH_SIZE: "${MACLAW_REDTEAM_SKILL_BATCH_SIZE:-}"
      MACLAW_REDTEAM_SKILL_BATCH_CONCURRENCY: "${MACLAW_REDTEAM_SKILL_BATCH_CONCURRENCY:-}"
    expose:
      - "18080"
    volumes:
      - maclaw_data:/data/maclaw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  hubcenter:
    image: "${MACLAW_HUBCENTER_IMAGE:-maclaw-hubcenter:latest}"
    container_name: ep_hubcenter
    restart: unless-stopped
    command: ["--config", "/app/configs/maclaw-hubcenter.yaml"]
    ports:
      - "9388:9388"
    volumes:
      - hubcenter_data:/data/hubcenter
      - ./configs/maclaw-hubcenter.yaml:/app/configs/maclaw-hubcenter.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9388/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ep_backend
    restart: unless-stopped
    # Same unreachable daemon DNS as maclaw-runtime: the BFF calls the judge
    # model (api.xiaomimimo.com) and LLM_BASE_URL (api.deepseek.com) directly.
    dns:
      - 10.95.38.38
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      maclaw-runtime:
        condition: service_healthy
      hubcenter:
        condition: service_healthy
      promptfoo-engine:
        condition: service_healthy
    environment:
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-dev}"
      CRYPTO_MASTER_KEY: "${CRYPTO_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      GIN_MODE: debug
      DATABASE_DSN: "host=postgres user=postgres password=Qianxinshujuku@2026 dbname=evaluating_platform port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
      STORAGE_ENDPOINT: "minio:9000"
      MACLAW_BASE_URL: "${MACLAW_BASE_URL:-http://maclaw-runtime:18080}"
      MACLAW_RUNTIME_KIND: "${MACLAW_RUNTIME_KIND:-maclawsrv}"
      MACLAW_RUNTIME_MODE: "${MACLAW_RUNTIME_MODE:-compose}"
      MACLAW_CAPABILITY_PROFILE: "${MACLAW_CAPABILITY_PROFILE:-shadow}"
      MACLAW_TIMEOUT_SECONDS: "${MACLAW_TIMEOUT_SECONDS:-360}"
      MACLAW_ADMIN_SECRET: "${MACLAW_ADMIN_SECRET:-ep-local-maclaw-admin-secret-change-me}"
      MACLAW_PROVISIONING_ENABLED: "true"
      MACLAW_REDTEAM_MCP_ENDPOINT: "${MACLAW_REDTEAM_MCP_ENDPOINT:-http://backend:8080/api/v1/internal/maclaw/redteam-mcp}"
      MACLAW_REDTEAM_MCP_SECRET: "${MACLAW_REDTEAM_MCP_SECRET:-ep-local-redteam-mcp-secret-change-me}"
      MACLAW_REDTEAM_TARGET_CONCURRENCY: "${MACLAW_REDTEAM_TARGET_CONCURRENCY:-5}"
      MACLAW_REDTEAM_TARGET_MAX_TOKENS: "${MACLAW_REDTEAM_TARGET_MAX_TOKENS:-512}"
      MACLAW_REDTEAM_JUDGE_MAX_TOKENS: "${MACLAW_REDTEAM_JUDGE_MAX_TOKENS:-1024}"
      # promptfoo-engine (Phase 0): BFF-side engine access. Empty base URL
      # disables all engine endpoints (fail-closed).
      PROMPTFOO_ENGINE_BASE_URL: "${PROMPTFOO_ENGINE_BASE_URL:-http://promptfoo-engine:8090}"
      PROMPTFOO_ENGINE_BEARER_TOKEN: "${PROMPTFOO_ENGINE_BEARER_TOKEN:-change-me-promptfoo-engine-bearer-secret}"
      PROMPTFOO_ENGINE_TIMEOUT_SECONDS: "${PROMPTFOO_ENGINE_TIMEOUT_SECONDS:-15}"
    ports:
      - "8088:8080"
    volumes:
      - ./configs:/app/configs:ro
      - ./migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: evaluating_platform-frontend:latest
    container_name: ep_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

  promptfoo-engine:
    build:
      context: ./promptfoo_engine
      dockerfile: Dockerfile
    image: evaluating_platform-promptfoo-engine:latest
    container_name: ep_promptfoo_engine
    restart: unless-stopped
    # ── U10 · sandbox boundary ───────────────────────────────────────────────
    # U10 executes expert-authored plugin packages inside this container, so the
    # boundary is declared here rather than assumed. See
    # promptfoo_engine/Dockerfile for the full rationale and for which property
    # is enforced in which layer.
    #
    # read_only: the root filesystem is mounted read-only. The only writable
    # surfaces are the two tmpfs mounts below plus the /data/runs volume.
    read_only: true
    tmpfs:
      # promptfoo and node both need a writable temp dir; without this the
      # container cannot even boot under read_only.
      - /tmp:rw,noexec,nosuid,size=256m
      # promptfoo's SQLite database lives under its config dir. Mounted as
      # tmpfs so a read-only root does not break it AND so the database does not
      # persist between container restarts — U7's cleanup contract
      # (promptfooStateCleanup) already removes run artifacts on every terminal
      # path, and an ephemeral mount removes the class of "state survived a
      # restart" residue entirely.
      - /home/node/.promptfoo:rw,noexec,nosuid,size=512m
    # Drop every capability: the engine needs none (it makes outbound HTTP
    # connections and writes files, neither of which requires a capability).
    cap_drop:
      - ALL
    # Refuse privilege escalation via setuid binaries.
    security_opt:
      - no-new-privileges:true
    environment:
      # fail-closed security switches (also asserted at boot by the engine)
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "1"
      PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION: "1"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_SHARE: "1"
      # ── U7 · 阶段一：打开 promptfoo 原生生成（Plan C）─────────────────────────
      #
      # 这是**阶段一的全部改动** —— 一个环境变量，零代码改动。它选择的是
      # 「谁写攻击提示词」：Plan A 由平台拼（`redteamRun.ts`，promptfoo 只做
      # 执行器），Plan C 由 promptfoo 自己的插件模板产出（`nativeRedteam.ts`）。
      #
      # **默认打开**（`:-1`）是本阶段的决定；`env.ts:parseBool` 把「未设置」与
      # 「拼错」一律映射为 false，所以回滚是在 `.env` 里写
      # `PROMPTFOO_ENGINE_NATIVE_GENERATION=0` —— **不改代码、不做数据迁移**
      # （`env.ts:96-97` 承诺的「一个变量即可回滚」在部署侧同样成立）。
      #
      # ⚠️ **开关打开不放松上面四个 fail-closed**，而是**追加**校验
      # （`env.ts:assertNativeGenerationInvariants`，原生开关为真时才跑）：
      #   - `OPENAI_API_KEY` 必须不存在 —— promptfoo 的 `shouldGenerateRemote()`
      #     只要看到它就返回 true，即便两个远程开关都关了；其
      #     `loadRedteamProvider` 还会静默回落到 `openai:gpt-5.5-*`。
      #   - `PROMPTFOO_REMOTE_GENERATION_URL` 同理（`shouldGenerateRemote()` 短路）。
      #   - `PROMPTFOO_CONFIG_DIR` 必须不存在 —— 它会把 Promptfoo Cloud 的登录
      #     状态暴露给库，而 `isLoggedIntoCloud()` 也是远程生成的触发条件之一。
      # 任一条不满足 → 引擎 `[FATAL]` 拒绝启动。**本节刻意不设置这三个变量。**
      #
      # 打开后同时挂载 `server.ts:60-62` 的 `onTerminal` 清理钩子：Plan C 会让
      # promptfoo 落盘 SQLite（`write: true` 在上游硬编码，无法关闭），钩子负责
      # 在成功/失败/中止三条终态路径删掉产物，清理失败把 run 降级为
      # `failed` + `terminal_cleanup_failed` 而不是静默留残留。
      PROMPTFOO_ENGINE_NATIVE_GENERATION: "${PROMPTFOO_ENGINE_NATIVE_GENERATION:-1}"
      # U10: declares the read-only root contract to the engine, which reports
      # it in its sandbox report and (with the probe below) actually tests it.
      PROMPTFOO_ENGINE_READONLY_ROOT: "1"
      # Opt in to the LIVE write/network probes at boot. Off by default because
      # it adds a network round-trip and a filesystem write attempt to every
      # start; turn it on in a deployment that wants the boundary measured
      # rather than declared. With it on, a reachable promptfoo remote service
      # or a writable root filesystem makes the engine REFUSE TO START.
      PROMPTFOO_ENGINE_SANDBOX_PROBE: "${PROMPTFOO_ENGINE_SANDBOX_PROBE:-0}"
      PROMPTFOO_ENGINE_BEARER_TOKEN: "${PROMPTFOO_ENGINE_BEARER_TOKEN:-change-me-promptfoo-engine-bearer-secret}"
      PROMPTFOO_ENGINE_PORT: "8090"
      PROMPTFOO_ENGINE_DATA_ROOT: /data/runs
      # P2-3: this value is CLAMPED TO 1 at boot whenever native generation is
      # on (PROMPTFOO_ENGINE_NATIVE_GENERATION=1), with a line in the engine log.
      # promptfoo keeps one SQLite file per process and the terminal cleanup
      # deletes it, so concurrent native runs would delete each other's results.
      # Setting a higher number here is therefore inert on the native path; it
      # only applies to Plan A runs. See promptfooDbLifecycle.ts.
      PROMPTFOO_ENGINE_WORKERS: "${PROMPTFOO_ENGINE_WORKERS:-2}"
      PROMPTFOO_ENGINE_MAX_QUEUE: "${PROMPTFOO_ENGINE_MAX_QUEUE:-100}"
    # Internal only: no host port mapping. The BFF reaches the engine over
    # the compose network at http://promptfoo-engine:8090.
    expose:
      - "8090"
    volumes:
      - promptfoo_engine_data:/data/runs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  maclaw_data:
  hubcenter_data:
  promptfoo_engine_data:

networks:
  default:
    name: ep_network